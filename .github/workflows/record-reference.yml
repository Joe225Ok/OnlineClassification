# Records the Linux reference of the integration test on the same runner and installation as the checks workflow.
# Run it by hand (Actions > record-reference > Run workflow) only after an agreed change to the pipeline, on the same
# commit the Windows reference was recorded from. Download the artifact and commit
# tests/reference/integration_reference_linux.json. Actions are pinned to the commit of a release (the comment names it).
name: record-reference

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (as in checks.yml)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Show the CPU and the code paths the libraries use
        run: |
          lscpu | grep -E 'Model name|Vendor ID'
          if grep -q avx512f /proc/cpuinfo; then echo 'CPU has AVX-512'; else echo 'CPU has no AVX-512'; fi
          python -c "import torch; print('PyTorch CPU capability:', torch.backends.cpu.get_cpu_capability())"
          python -m threadpoolctl -i numpy scipy torch

      - name: Record the reference
        run: python tests/record_reference.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: integration-reference-linux
          path: tests/reference/integration_reference_linux.json
          if-no-files-found: error
