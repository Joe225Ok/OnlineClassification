# SonarQube Cloud settings, read by the "SonarQube analysis" step of .github/workflows/checks.yml
# (project: https://sonarcloud.io/project/configuration?id=Joe225Ok_OnlineClassification). The analysis step is skipped
# until the repository has a SONAR_TOKEN secret.
sonar.projectKey=Joe225Ok_OnlineClassification
sonar.organization=joe225ok
sonar.projectName=OnlineClassification

# Scope: only the code under src/Project is analysed (tests/ as test code). Scanner auto-configuration is turned off,
# since it replaces sonar.sources with the whole repository (the notebook and tests/ were analysed as main code), and
# the separate analysis of GitHub Actions workflows is turned off, since .github/ is outside this scope.
sonar.scanner.autoconfig.enabled=false
sonar.githubactions.activate=false
sonar.sources=src/Project
sonar.inclusions=src/Project/**/*.py
sonar.tests=tests
sonar.exclusions=src/Project/data/**,src/Project/artifacts/**,src/Project/runs/**
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
