# Unit tests, lint and coverage on every push and pull request, then a SonarQube Cloud analysis with that coverage.
# The tests need no data files (tests/ builds every input by hand), so they run on a plain runner.
# Actions are pinned to the commit of a release (the comment names it): a moved tag cannot change what runs.
name: checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    name: Lint, tests, coverage and SonarQube analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history: shallow clones make the analysis less relevant (blame, new code)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install (CPU build of torch, then the pinned requirements)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Show the CPU and the code paths the libraries use
        run: |
          lscpu | grep -E 'Model name|Vendor ID'
          if grep -q avx512f /proc/cpuinfo; then echo 'CPU has AVX-512'; else echo 'CPU has no AVX-512'; fi
          python -c "import torch; print('PyTorch CPU capability:', torch.backends.cpu.get_cpu_capability())"
          python -m threadpoolctl -i numpy scipy torch

      - name: Lint (pyflakes)
        run: python -m pyflakes src/Project/kitsune_lib.py src/Project/run_all.py src/Project/safeguard.py src/Project/pipeline tests

      # SKIP_MACHINE_SENSITIVE: GitHub runners differ in CPU, which moves seven reference values of the integration test
      # (tests/integration_support.py, MACHINE_SENSITIVE). They are skipped here and -rs prints why; the other reference
      # values are compared as usual.
      - name: Unit tests with coverage
        env:
          SKIP_MACHINE_SENSITIVE: "1"
        run: python -m pytest -q -rs --cov=src/Project --cov-report=xml:coverage.xml --cov-report=term

      # SonarQube Cloud: needs the SONAR_TOKEN secret (both steps are skipped without it) and Automatic Analysis turned
      # off for the project (Administration > Analysis Method), or this CI analysis is refused. Organization, project
      # key and the coverage report are in sonar-project.properties. v8 verifies the scanner's signature with gpg, which
      # ubuntu-latest has; v5 is no longer supported.
      - name: Cache SonarQube packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4  # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
